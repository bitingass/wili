name: Release Wili Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and attach release assets to (e.g. v1.2.7)'
        required: true
        type: string
      draft:
        description: 'Create as draft release (ignored if release already exists)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid tag format: ${TAG} (expected vX.Y.Z)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Workshop release zip and checksums
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python3 art/tools/build_release_zip.py --tag "${TAG}" --out-dir dist

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          ZIP_FILE="dist/wili-${VERSION}.zip"
          SUMS_FILE="dist/SHA256SUMS.txt"
          NOTES_FILE="dist/RELEASE_NOTES.md"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading/replacing assets..."
            gh release upload "${TAG}" "${ZIP_FILE}" "${SUMS_FILE}" --clobber
          else
            EXTRA_ARGS=()
            if [ "${IS_DRAFT}" = "true" ]; then
              EXTRA_ARGS+=(--draft)
            fi
            gh release create "${TAG}" "${ZIP_FILE}" "${SUMS_FILE}" \
              --title "Wili ${VERSION}" \
              --notes-file "${NOTES_FILE}" \
              "${EXTRA_ARGS[@]}"
          fi
